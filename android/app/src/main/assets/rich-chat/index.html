<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'none'; connect-src 'none'">
<link rel="stylesheet" href="katex.min.css"><style>
html,body{margin:0;padding:0;background:transparent}body{font:15px/1.5 sans-serif;color:#2c364b;overflow-wrap:anywhere}
p{margin:.35em 0}h1,h2,h3,h4{line-height:1.3;margin:.6em 0 .35em}ul,ol{padding-left:1.4em;margin:.4em 0}pre{overflow-x:auto;background:#eff2f7;padding:8px;border-radius:6px}code{font-family:monospace;background:#eff2f7}pre code{background:none}blockquote{border-left:3px solid #a8b8c9;margin:.5em 0;padding-left:.7em;color:#4a637d}a{color:#1668ae}section{overflow-x:auto}table{border-collapse:collapse;display:block;overflow-x:auto}td,th{border:1px solid #ccd4de;padding:4px}
</style><script src="katex.min.js"></script><script src="markdown-it.min.js"></script><script src="texmath.js"></script></head><body><div id="message"></div><script>
const md=window.markdownit({html:false,linkify:false,breaks:true}).use(texmath,{engine:katex,delimiters:['dollars','brackets'],katexOptions:{throwOnError:false,trust:false,strict:'ignore'}});
function renderMessage(text){document.getElementById('message').innerHTML=md.render(text);return Math.ceil(document.documentElement.scrollHeight)}
</script></body></html>
