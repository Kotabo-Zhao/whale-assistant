    'legal/licenses/dsh-see-now-LICENSE.txt' : new File(appSourceRoot, 'scripts/runtime-profile/plugins/dsh-mobile-shizuku/lib/see-now-core/LICENSE'),
    'legal/licenses/dsh-see-now-NOTICE.txt' : new File(appSourceRoot, 'scripts/runtime-profile/plugins/dsh-mobile-shizuku/lib/see-now-core/NOTICE'),
    'legal/LICENSE'                             : new File(appSourceRoot, 'LICENSE'),
    'legal/THIRD_PARTY_NOTICES.md'              : new File(appSourceRoot, 'THIRD_PARTY_NOTICES.md'),
    'legal/licenses/react-LICENSE.txt'           : new File(appSourceRoot, 'node_modules/react/LICENSE'),
    'legal/licenses/react-dom-LICENSE.txt'       : new File(appSourceRoot, 'node_modules/react-dom/LICENSE'),
    'legal/licenses/dsh-web-frontend-LICENSE.txt': new File(appSourceRoot, 'harness-web/node_modules/@deepseek-ai/dsh-web-frontend/LICENSE'),
    'legal/licenses/capacitor-core-LICENSE.txt'  : new File(appSourceRoot, 'node_modules/@capacitor/core/LICENSE'),
