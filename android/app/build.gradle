    'legal/licenses/bge-base-zh-v1.5-MIT.txt'    : new File(appSourceRoot, 'legal/licenses/bge-base-zh-v1.5-MIT.txt'),
    'legal/licenses/vosk-LICENSE.txt'            : new File(appSourceRoot, 'legal/licenses/vosk-LICENSE.txt'),
    'legal/licenses/jna-LICENSE.txt'             : new File(appSourceRoot, 'legal/licenses/jna-LICENSE.txt'),
    'legal/licenses/jsoup-LICENSE.txt'           : new File(appSourceRoot, 'legal/licenses/jsoup-LICENSE.txt'),
    'legal/licenses/lucide-react-LICENSE.txt'    : new File(appSourceRoot, 'node_modules/lucide-react/LICENSE'),
    'legal/licenses/katex-LICENSE.txt'           : new File(appSourceRoot, 'node_modules/katex/LICENSE'),
    'legal/licenses/markdown-it-LICENSE.txt'     : new File(appSourceRoot, 'node_modules/markdown-it/LICENSE'),
    'legal/licenses/markdown-it-texmath-LICENSE.txt': new File(appSourceRoot, 'node_modules/markdown-it-texmath/license.txt'),
    'legal/licenses/proot-GPL-2.0.txt'            : new File(appSourceRoot, 'legal/licenses/proot-GPL-2.0.txt'),
    'legal/licenses/operit2-AGPL-3.0.txt'         : new File(appSourceRoot, 'legal/licenses/operit2-AGPL-3.0.txt'),
    'legal/licenses/operit-terminal-core-LGPL-3.0.txt': new File(appSourceRoot, 'legal/licenses/operit-terminal-core-LGPL-3.0.txt'),
    'legal/licenses/gnu-LGPL-3.0.txt'              : new File(appSourceRoot, 'legal/licenses/gnu-LGPL-3.0.txt'),
    'legal/licenses/gnu-GPL-3.0.txt'               : new File(appSourceRoot, 'legal/licenses/gnu-GPL-3.0.txt'),
]
def unavailableLegalAssetSources = legalAssetSources.findAll { _, source ->
    !source.isFile() || !source.canRead() || source.length() == 0L
}
if (!unavailableLegalAssetSources.isEmpty()) {
    def unavailablePaths = unavailableLegalAssetSources.values()
        .collect { appSourceRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/') }
        .sort()
        .join(', ')
    throw new GradleException(
        "Required APK legal material is missing, unreadable, or empty: ${unavailablePaths}. " +
            'Install the pinned JavaScript dependencies before configuring the Android build.'
    )
}

def generatedLegalAssetsDirectory = layout.buildDirectory.dir('generated/assets/legalBundle')
def generateLegalAssets = tasks.register('generateLegalAssets', Sync) {
    into(generatedLegalAssetsDirectory)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    legalAssetSources.each { assetPath, source ->
        def assetFile = new File(assetPath)
        from(source) {
            into(assetFile.parent.replace('\\', '/'))
            rename { assetFile.name }
        }
    }
}

// The local embedding model is intentionally fetched during the build instead of committed to
// Git: its verified 103 MB binary exceeds normal source-host limits, but it is always embedded
// in the resulting APK.  The immutable SHA-256 turns the upstream download into a reproducible
// build input rather than accepting whichever bytes happen to be served by the URL.
def bgeModelUrl = 'https://huggingface.co/Xenova/bge-base-zh-v1.5/resolve/main/onnx/model_quantized.onnx'
def bgeModelSha256 = 'b665f3bba56c3119bc76ba131ebcc544d720a7408cb11581bdf354aaa0198d43'
def bgeVocabUrl = 'https://huggingface.co/Xenova/bge-base-zh-v1.5/resolve/main/vocab.txt'
def bgeVocabSha256 = '45bbac6b341c319adc98a532532882e91a9cefc0329aa57bac9ae761c27b291c'
def generatedBgeAssetsDirectory = layout.buildDirectory.dir('generated/assets/bgeBaseZh')
def generatedRichChatAssets = layout.buildDirectory.dir('generated/assets/richChat')
def generateRichChatAssets = tasks.register('generateRichChatAssets', Sync) {
    into(generatedRichChatAssets.map { it.dir('rich-chat') })
    from(new File(appSourceRoot, 'node_modules/katex/dist')) {
        include 'katex.min.js', 'katex.min.css', 'fonts/*.woff2'
    }
    from(new File(appSourceRoot, 'node_modules/markdown-it/dist/markdown-it.min.js'))
    from(new File(appSourceRoot, 'node_modules/markdown-it-texmath/texmath.js'))
}
def downloadBgeBaseAssets = tasks.register('downloadBgeBaseAssets') {
    def outputDirectory = generatedBgeAssetsDirectory
    outputs.dir(outputDirectory)
    doLast {
        def downloadVerified = { String url, String sha256, String name ->
            def target = new File(outputDirectory.get().asFile, "models/${name}")
            target.parentFile.mkdirs()
            def digest = { File candidate -> java.security.MessageDigest.getInstance('SHA-256').digest(candidate.bytes).encodeHex().toString() }
            if (!target.isFile() || !digest(target).equalsIgnoreCase(sha256)) {
                def temporary = new File(target.parentFile, "${name}.part")
                try {
                    def proxyValue = System.getenv('HTTPS_PROXY') ?: System.getenv('HTTP_PROXY')
                    def connection = new URL(url).openConnection(proxyValue ? new java.net.Proxy(java.net.Proxy.Type.HTTP, new java.net.InetSocketAddress(new URI(proxyValue).host, new URI(proxyValue).port)) : java.net.Proxy.NO_PROXY)
                    connection.connectTimeout = 30_000
                    connection.readTimeout = 120_000
                    connection.getInputStream().withCloseable { input -> temporary.withOutputStream { output -> output << input } }
                    if (!digest(temporary).equalsIgnoreCase(sha256)) throw new GradleException("BGE base zh asset digest mismatch: ${name}")
                    if (target.exists() && !target.delete()) throw new GradleException("Cannot replace BGE base zh asset: ${target}")
                    if (!temporary.renameTo(target)) throw new GradleException("Cannot publish BGE base zh asset: ${target}")
                } finally {
                    if (temporary.exists()) temporary.delete()
                }
            }
        }
        downloadVerified(bgeModelUrl, bgeModelSha256, 'bge-base-zh-v1.5-int8.onnx')
        downloadVerified(bgeVocabUrl, bgeVocabSha256, 'bge-base-zh-v1.5-vocab.txt')
        downloadVerified('https://alphacephei.com/vosk/models/vosk-model-small-cn-0.22.zip',
            '3af8b0e7e0f835ae9d414ce5df580237a3cfb08d586c9fbbb0f7ff29ad5b14ba', 'vosk-model-small-cn-0.22.zip')
    }
}

android {
    namespace 'io.deepseekharness.mobile'
    compileSdk 35
    ndkVersion '27.1.12297006'

    signingConfigs {
        if (teamSigning != null) {
            team {
                storeFile teamSigning.storeFile
                storePassword teamSigning.storePassword
                keyAlias teamSigning.keyAlias
                keyPassword teamSigning.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'io.deepseekharness.mobile'
        minSdk 26
        targetSdk 35
        versionCode 94
        versionName '0.3.8-preview.49'

        buildConfigField 'String', 'DEFAULT_MANIFEST_URL', envBuildValue('DSH_RUNTIME_MANIFEST_URL')
        buildConfigField 'String', 'DEFAULT_MANIFEST_SHA256', envBuildValue('DSH_RUNTIME_MANIFEST_SHA256')

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-Wall -Wextra -Werror -Wconversion -Wshadow -fstack-protector-strong -fvisibility=hidden -D_FORTIFY_SOURCE=2'
                cFlags '-Wall -Wextra -Werror -Wconversion -Wshadow -fstack-protector-strong -fvisibility=hidden -D_FORTIFY_SOURCE=2'
            }
        }

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDir(generatedLegalAssetsDirectory)
            assets.srcDir(generatedBgeAssetsDirectory)
            assets.srcDir(generatedRichChatAssets)
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            if (teamSigning != null) {
                signingConfig signingConfigs.team
            }
        }
        release {
            if (teamSigning != null) {
                signingConfig signingConfigs.team
            }
            // 发布版不混淆代码（项目约定，见 android/README.md「构建策略」）。
            // 本包绝大部分体积是 rootfs，混淆省下的字节可以忽略；而 R8 会改写类名/反射入口，
            // Shizuku 的 UserService、以及只按名字反射的桥接层最容易在这里失效——0.3.5 的
            // Shizuku 连接超时排查就绕在这条链路上，故直接关掉，不做「部分保留规则」的折中。
            minifyEnabled false
            // 资源裁剪/改名对本包没有实际收益（体积 98% 是 rootfs），
            // 却会把 res/xml/network_security_config.xml 改成 res/8G.xml 这类短路径，
            // 让「NSC 规则冲突」这类崩溃（0.3.5 的 Shizuku UserService）现场更难核对。
            shrinkResources false
            // 上面两项关闭后这里不生效；保留是为了将来确有需要时不必重新查规则文件位置。
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            keepDebugSymbols += ['**/libdsh_proot.so']
        }
        resources {
            // Curated license texts are APK assets; these exclusions only resolve dependency META-INF collisions.
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }

    androidResources {
        // The opaque suffix prevents AAPT from transparently expanding and renaming gzip assets.
        noCompress += ['bundle', 'onnx']
    }
}

kotlin {
    jvmToolchain(21)
}

tasks.named('preBuild').configure {
    dependsOn(generateLegalAssets)
    dependsOn(downloadBgeBaseAssets)
    dependsOn(generateRichChatAssets)
}

tasks.configureEach { task ->
    if (teamSigning == null && (task.name.startsWith("assembleRelease") || task.name.startsWith("bundleRelease") || task.name.startsWith("packageRelease"))) {
        task.doFirst {
            throw new GradleException(
                '缺少团队签名配置：请配置 android/keystore.properties（参照 keystore.properties.example），' +
                    '或提供 DSH_KEYSTORE_BASE64/DSH_KEYSTORE_PASSWORD 环境变量。禁止以个人密钥签名分发 Release APK。'
            )
        }
    }
}

dependencies {
    implementation project(':capacitor-android')
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    // 忘记验证密码时的系统身份确认（生物识别 / 锁屏密码）。用 androidx 封装而不是平台的
    // android.hardware.biometrics.BiometricPrompt：后者的 API 30 常量需要 Build.VERSION.SDK_INT
    // 守卫写在**调用点**，而回调在匿名类里，Lint 的 NewApi 看不到外层的 if（本仓库在
    // RuntimeStorageDirs.kt 上已经吃过一次「单测全绿、lintRelease 失败」的亏）。
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'commons-io:commons-io:2.17.0'
    implementation 'org.snakeyaml:snakeyaml-engine:2.9'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'org.jsoup:jsoup:1.18.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

if (file('capacitor.build.gradle').exists()) {
    apply from: 'capacitor.build.gradle'
}
