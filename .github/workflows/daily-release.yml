name: Daily Whale Assistant Release

on:
  schedule:
    # 每天北京时间 04:00（UTC 20:00）自动编译并发布最新 Lite 原生 APK
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      tag_suffix:
        description: '可选自定义标签后缀（留空则按日期生成 nightly-YYYYMMDD）'
        required: false
        default: ''
      skip_emulator:
        description: '跳过云端模拟器冒烟测试（默认 false，自动实机冒烟测试）'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-whale-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Lite APK & Publish Daily Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      apk: ${{ steps.meta.outputs.apk }}
      sha: ${{ steps.meta.outputs.sha }}
      date: ${{ steps.meta.outputs.date }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python 3.11 (for Chaquopy pip)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets & lint
        run: |
          pnpm run build
          pnpm run lint

      - name: Sync Capacitor Android assets
        run: pnpm run android:sync

      - name: Set up Gradle & bootstrap wrapper
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Ensure gradle-wrapper.jar exists
        run: |
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p .wrapper-bootstrap
            (cd .wrapper-bootstrap && gradle wrapper --no-daemon)
            cp .wrapper-bootstrap/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            rm -rf .wrapper-bootstrap
          fi
          chmod +x android/gradlew

      - name: Run Android unit tests & build Lite APK
        working-directory: android
        run: ./gradlew testDebugUnitTest -PwhaleSeparateRuntime=true -PwhaleVersionCode=$((146 + GITHUB_RUN_NUMBER)) assembleDebug --no-daemon

      - name: Prepare release artifacts
        id: meta
        run: |
          DATE_TAG=$(TZ='Asia/Shanghai' date +%Y%m%d)
          SHORT_SHA=$(git rev-parse --short HEAD)
          SUFFIX="${{ inputs.tag_suffix }}"
          if [ -n "$SUFFIX" ]; then
            RELEASE_TAG="nightly-${DATE_TAG}-${SUFFIX}"
          else
            RELEASE_TAG="nightly-${DATE_TAG}"
          fi
          mkdir -p release-out
          APK_SRC="android/build/whale-light-app/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ]; then APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"; fi
          APK_NAME="whale-assistant-lite-${DATE_TAG}-${SHORT_SHA}.apk"
          cp "$APK_SRC" "release-out/${APK_NAME}"
          (cd release-out && sha256sum "${APK_NAME}" > SHA256SUMS.txt)
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          TITLE="Whale Assistant Daily Build (${{ steps.meta.outputs.date }} · ${{ steps.meta.outputs.sha }})"
          NOTES=$(cat <<EOF
          ## 鲸鱼助手每日自动构建（Lite 纯原生版）

          - **构建日期**：${{ steps.meta.outputs.date }}（北京时间）
          - **提交版本**：\`${{ steps.meta.outputs.sha }}\`
          - **安装包**：\`${{ steps.meta.outputs.apk }}\`（已剥离 395 MB PRoot Linux 容器，100% Android 原生运行）
          - **校验文件**：\`SHA256SUMS.txt\`

          ### 最近变更
          $(git log -n 8 --pretty=format:'- %h %s')
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-out/* --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" release-out/* \
              --title "$TITLE" \
              --notes "$NOTES" \
              --prerelease
          fi

  emulator-smoke-test:
    name: Cloud Android Emulator Smoke Test
    needs: build-and-release
    if: ${{ !inputs.skip_emulator }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM group permissions
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          fi

      - name: Download newly released Lite APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p smoke-out
          gh release download "${{ needs.build-and-release.outputs.tag }}" \
            -p "${{ needs.build-and-release.outputs.apk }}" \
            -D smoke-out

      - name: Run Android 14 Emulator Smoke Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci-emulator-smoke.sh "smoke-out/${{ needs.build-and-release.outputs.apk }}" smoke-out

      - name: Publish smoke test report & screenshots to Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f smoke-out/smoke-test-report.txt ]; then
            {
              echo "### Cloud Android Emulator Smoke Test (${{ needs.build-and-release.outputs.sha }})"
              echo '```text'
              cat smoke-out/smoke-test-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          UPLOAD_FILES=()
          for f in smoke-out/smoke-test-report.txt smoke-out/*.png; do
            if [ -f "$f" ]; then UPLOAD_FILES+=("$f"); fi
          done
          if [ "${#UPLOAD_FILES[@]}" -gt 0 ]; then
            gh release upload "${{ needs.build-and-release.outputs.tag }}" "${UPLOAD_FILES[@]}" --clobber || true
          fi
